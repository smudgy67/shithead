<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efe8dc">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>shithead</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Playfair+Display:wght@400;700&family=Lora:wght@400;700&family=Cormorant+Garamond:wght@500;700&family=Nunito:wght@400;700&family=Quicksand:wght@400;700&family=Comfortaa:wght@400;700&family=Josefin+Sans:wght@400;700&family=Dancing+Script:wght@400;700&family=Great+Vibes&family=Courier+Prime:wght@400;700&family=Righteous&display=swap">
<style>
/* Layout: smudgenet app shell (logo tile + name box, app settings sheet) around one tall card table:
   opponents along the top, deck and pile in the middle, your seat at the bottom.
   Colours come from the smudgenet app themes (same set as mods); the app's own theme picker sets them, so the page ignores the viewer's light/dark mode on purpose. */
:root{
  --bg:#efe8dc; --panel:#fffdf8; --field:#ffffff; --ink:#1f1c17; --muted:#6f675b; --line:#e4dccb; --accent:#b8733a; --accent-ink:#ffffff;
  --face:#fffefb; --face-ink:#1b1e25; --red:#c42e3b; --joker:#5a45c2; --good:#2f9a5f; --bad:#c4402f;
  --accent-2:color-mix(in srgb,var(--accent) 72%,#000);
  --font:"Space Grotesk";
  --display:var(--font),"Space Grotesk",system-ui,sans-serif;
  --body:var(--font),"Space Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --scale:1;
  --cw:clamp(46px,13vw,74px);
  color-scheme:light;
}
html,body{height:100%;-webkit-tap-highlight-color:transparent;touch-action:manipulation;background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;background:var(--bg);text-transform:lowercase}
.maim{text-transform:none}
input,button,textarea{text-transform:inherit}
[hidden]{display:none!important}
#app,#top{zoom:var(--scale)}
#app{max-width:980px;margin:0 auto;padding-block:8px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.label{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:700}

/* smudgenet header: pulsing logo tile with the name box under it */
#top{max-width:980px;margin:0 auto;padding-top:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:center;align-items:flex-start;gap:12px;position:relative}
#top>.topacts{position:absolute;top:12px;left:max(16px,env(safe-area-inset-left,0px));display:flex;gap:8px;align-items:flex-start}
@media (max-width:600px){#top>.topacts{flex-direction:column}}
#top>.topbtns{position:absolute;top:12px;right:max(16px,env(safe-area-inset-right,0px))}
.title{display:flex;flex-direction:column;align-items:stretch;gap:5px;width:84px;flex:none}
body.home .title{width:120px}
.title .logo{box-sizing:border-box;position:relative;width:100%;aspect-ratio:1;border-radius:20%;overflow:hidden;display:block;transition:transform 700ms cubic-bezier(.25,.46,.45,.94)}
.title .logo img{position:absolute;inset:0;width:100%;height:100%;display:block}
.title .logo img.g{opacity:0;transition:opacity 1400ms cubic-bezier(.455,.03,.515,.955),transform 700ms cubic-bezier(.25,.46,.45,.94)}
.title .tbox{box-sizing:border-box;width:100%;margin:0;padding:5px 4px;border:1px solid var(--line);border-radius:14px;background:var(--panel);text-align:center;overflow:hidden}
.title .tbox b{display:block;font-size:1rem;font-weight:700;line-height:1.15}
body.home .title .tbox b{font-size:1.3rem}
.title .tbox span{display:block;font-size:.6rem;letter-spacing:.18em;text-indent:.18em;color:var(--muted);margin-top:-1px}
.topbtns{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:8px}
.iconbtn{width:42px;height:42px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);display:grid;place-items:center;cursor:pointer;font-size:19px;line-height:1;padding:0}
.iconbtn:hover{border-color:var(--accent)}

/* buttons */
.btn{font-family:var(--display);font-weight:700;font-size:15px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:10px 20px;cursor:pointer;transition:transform .12s,background .12s}
.btn:hover:not(:disabled){background:color-mix(in srgb,var(--accent) 86%,var(--ink))}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:hover:not(:disabled){background:color-mix(in srgb,var(--ink) 6%,transparent)}
.btn.sm{padding:6px 14px;font-size:13px}
.btn.warn{background:var(--bad);color:#fff}

/* cards */
.card{width:var(--cw);aspect-ratio:5/7;border-radius:calc(var(--cw)*.11);background:var(--face);color:var(--face-ink);position:relative;border:0;padding:0;font-family:var(--display);text-transform:none;box-shadow:0 0 0 1px rgba(0,0,0,.07),0 1px 0 rgba(0,0,0,.3),0 5px 12px rgba(0,0,0,.28);flex:none;display:block;transition:transform .15s,box-shadow .15s,filter .15s;cursor:default;user-select:none}
.card.red{color:var(--red)}
.card.joker{color:var(--face-ink)}
.card.joker.red{color:var(--red)}
.card.joker .jester{position:absolute;inset:0;width:100%;height:100%}
.card .ix{position:absolute;top:7%;left:10%;font-weight:800;font-size:calc(var(--cw)*.29);line-height:.92;display:flex;flex-direction:column;align-items:center}
.card .ix i{font-style:normal;font-size:.72em}
.card .pip{position:absolute;right:9%;bottom:5%;font-size:calc(var(--cw)*.5);line-height:1}
.card.special::after{content:"";position:absolute;inset:3px;border-radius:calc(var(--cw)*.09);box-shadow:inset 0 0 0 1.5px currentColor;opacity:.22;pointer-events:none}
.card.back{background:var(--back-bg,repeating-linear-gradient(135deg,var(--accent) 0 5px,var(--accent-2) 5px 7px));box-shadow:inset 0 0 0 3px var(--face),inset 0 0 0 5px var(--accent-ink),0 1px 0 rgba(0,0,0,.3),0 5px 12px rgba(0,0,0,.28)}
.card.back::before{content:var(--back-mark,"SH");position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:calc(var(--cw)*.36);letter-spacing:-.04em;color:var(--back-mc,var(--accent-ink));opacity:.85}
/* card back designs, picked in app settings */
[data-back="smudge"]{--back-bg:var(--logo-url,none) center/cover no-repeat,#111;--back-mark:""}
[data-back="red"]{--back-bg:repeating-linear-gradient(45deg,transparent 0 5px,rgba(255,255,255,.5) 5px 6px),repeating-linear-gradient(-45deg,transparent 0 5px,rgba(255,255,255,.5) 5px 6px),#b3202a;--back-mark:""}
[data-back="blue"]{--back-bg:repeating-linear-gradient(45deg,transparent 0 5px,rgba(255,255,255,.5) 5px 6px),repeating-linear-gradient(-45deg,transparent 0 5px,rgba(255,255,255,.5) 5px 6px),#1f4fa8;--back-mark:""}
[data-back="midnight"]{--back-bg:radial-gradient(circle at 50% 45%,#34408a,#0d1230 75%);--back-mark:"★";--back-mc:#e8c35a}
[data-back="tartan"]{--back-bg:repeating-linear-gradient(0deg,rgba(200,30,40,.6) 0 3px,transparent 3px 11px),repeating-linear-gradient(90deg,rgba(200,30,40,.6) 0 3px,transparent 3px 11px),repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 1px,transparent 1px 5px),#1f5d3a;--back-mark:""}
[data-back="poo"]{--back-bg:radial-gradient(circle at 50% 50%,#8a5a2b,#4a2e14 80%);--back-mark:"💩"}
.backs{display:flex;flex-wrap:wrap;gap:10px}
.pile .card.under{box-shadow:0 0 0 3px var(--accent),0 5px 14px rgba(0,0,0,.3)}
.undertag{color:var(--accent)!important;font-weight:700}
.sdesc{margin:6px 0 0;text-align:center;font-size:.78rem;color:var(--muted)}
.card.peek{outline:2px dashed var(--accent);outline-offset:-2px}
.opp,section.me{position:relative}
.bubble{position:fixed;z-index:30;max-width:min(70vw,320px);background:var(--ink);color:var(--bg);font-size:13px;font-weight:700;padding:7px 12px;border-radius:14px 14px 4px 14px;box-shadow:0 6px 18px rgba(0,0,0,.25);animation:bubble 2.8s ease both;pointer-events:none}
.bubble.emoji{background:transparent;box-shadow:none;font-size:34px;padding:0;margin-top:-8px}
@keyframes bubble{0%{opacity:0;transform:translateY(6px) scale(.8)}10%,85%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-6px)}}
.pilewrap{position:relative}
.flames{position:fixed;pointer-events:none;z-index:30}
.flames span{position:absolute;bottom:0;animation:flame 1.2s ease-out both}
@keyframes flame{0%{opacity:0;transform:translateY(10px) scale(.5)}25%{opacity:1}100%{opacity:0;transform:translateY(-70px) scale(1.3)}}
.flycard{--cw:40px;position:fixed;z-index:40;pointer-events:none;margin:0}
.emotes{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.emote{font-size:24px;background:var(--panel);border:1px solid var(--line);border-radius:999px;width:46px;height:46px;cursor:pointer;padding:0}
.emote:active{transform:scale(.9)}
.shtable{width:100%;max-width:420px;margin:10px auto;border-collapse:collapse;color:var(--ink);font-variant-numeric:tabular-nums}
.shtable th{font-size:11px;letter-spacing:.08em;color:var(--muted);text-align:right;padding:4px 6px}
.shtable td{padding:6px;text-align:right;border-top:1px solid var(--line)}
.shtable th:first-child,.shtable td:first-child{text-align:left}
@media (prefers-reduced-motion:reduce){.bubble{animation:none}}
/* your turn box: table cards centred, hand centred underneath; tighter layout so buttons sit clear of the phone's home bar */
.me{gap:8px;padding:10px 12px}
.me-row{flex-direction:column;align-items:center;gap:8px}
.me .zone{align-items:center;width:100%}
.me .zone[style]{flex:none!important}
.me .hand{justify-content:center;padding-top:8px;min-height:calc(var(--cw)*1.4 + 8px)}
.me .hand.tight{padding-right:calc(var(--cw)*.3)}
.me .prompt{text-align:center;font-size:14px}
.me .actions{justify-content:center}
.me-head h2{font-size:18px}
#app{gap:10px;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.centre{padding:4px;gap:10px}
.opp{padding:8px 10px;gap:6px}
.log{min-height:0;padding:6px 2px;font-size:12px}
.log div:not(:nth-last-child(-n+2)){display:none}
body:not(.home) .title{width:60px}
body:not(.home) .title .tbox{padding:3px 2px}
body:not(.home) .title .tbox b{font-size:.72rem}
body:not(.home) .title .tbox span{font-size:.45rem}
.opp .zone>.label{display:none}
.opp-body{gap:10px}
.opp-head h3{font-size:15px}
@media (max-width:600px){:root{--cw:clamp(42px,12vw,64px)}.pilewrap{--cw:clamp(54px,15vw,84px)}.stack{--cw:clamp(44px,12vw,64px)}}
.backbtn{--cw:38px;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:2px solid transparent;border-radius:10px;padding:4px;cursor:pointer;font:inherit;font-size:.75rem;color:var(--ink)}
.backbtn.on{border-color:var(--accent)}
.card.ok{cursor:pointer}
.card.ok:hover{transform:translateY(-5px)}
.card.sel{transform:translateY(-14px)!important;box-shadow:0 0 0 3px var(--accent),0 10px 18px rgba(0,0,0,.4)}
.card.dim{filter:brightness(.55) saturate(.5)}
.card.swapsel{box-shadow:0 0 0 3px var(--good),0 10px 18px rgba(0,0,0,.4);transform:translateY(-8px)}
.card.nudge{animation:nudge .3s}
@keyframes nudge{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.placeholder{width:var(--cw);aspect-ratio:5/7;border-radius:calc(var(--cw)*.11);box-shadow:inset 0 0 0 1.5px var(--line);flex:none}

/* table slots: face-up card sits over its face-down card */
.slots{display:flex;gap:calc(var(--cw)*.16)}
.slot{position:relative;width:var(--cw);height:calc(var(--cw)*1.4 + var(--cw)*.22)}
.slot>*{position:absolute;left:0}
.slot>.d{top:0}
.slot>.u{top:calc(var(--cw)*.22)}

/* opponents */
.opps{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.opp{--cw:clamp(30px,8.4vw,42px);background:var(--panel);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .2s}
.opp.active{box-shadow:inset 0 0 0 2px var(--accent)}
.opp-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.opp-head h3{font-size:16px}
.opp-body{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.fan{display:flex;align-items:center}
.fan .card{margin-left:calc(var(--cw)*-.62)}
.fan .card:first-child{margin-left:0}
.count{font-family:var(--display);font-weight:700;font-size:13px;color:var(--muted);margin-left:6px;font-variant-numeric:tabular-nums}
.chip{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:color-mix(in srgb,var(--ink) 7%,transparent);color:var(--muted);white-space:nowrap}
.chip.turn{background:var(--accent);color:var(--accent-ink)}
.chip.out{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.chip.cpu{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}

/* centre */
.centre{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;padding:14px 4px}
.stack{--cw:clamp(50px,13vw,74px);display:flex;flex-direction:column;align-items:center;gap:6px}
.deckpile{position:relative}
.deckpile .card:nth-child(2){position:absolute;top:-3px;left:-3px}
.pilewrap{--cw:clamp(60px,17vw,96px);display:flex;flex-direction:column;align-items:center;gap:8px}
.pile{position:relative;width:calc(var(--cw)*1.9);height:calc(var(--cw)*1.4 + 10px);display:grid;place-items:center}
.pile .card{position:absolute}
.pile.burn{animation:burn .7s ease-out}
@keyframes burn{0%{filter:none}30%{filter:drop-shadow(0 0 22px var(--accent)) brightness(1.4)}100%{filter:none}}
.need{font-family:var(--display);font-weight:700;font-size:16px;text-align:center}
.need small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
.flash{font-family:var(--display);font-weight:800;color:var(--accent);font-size:13px;letter-spacing:.14em;text-transform:uppercase;min-height:1.2em}

.log{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted);min-height:3.6em;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 2px}
.log div:last-child{color:var(--ink)}

/* your seat */
.me{display:flex;flex-direction:column;gap:12px;background:var(--panel);border-radius:20px;padding:14px;box-shadow:inset 0 0 0 1px var(--line)}
.me.active{box-shadow:inset 0 0 0 2px var(--accent)}
.me-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.me-head h2{font-size:20px}
.prompt{font-weight:600}
.me-row{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.zone{display:flex;flex-direction:column;gap:6px;min-width:0}
.hand{display:flex;flex-wrap:wrap;gap:6px;padding-top:16px;min-height:calc(var(--cw)*1.4 + 16px)}
.hand.tight{gap:0}
.hand.tight .card{margin-right:calc(var(--cw)*-.3)}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.actions.center{justify-content:center}

/* setup */
.setup{max-width:560px;margin:4vh auto 0;display:flex;flex-direction:column;gap:22px;width:100%}
.hero{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.hero h1{display:none;font-size:clamp(44px,12vw,76px);font-weight:800;line-height:.9}
.hero p{margin:0;color:var(--muted);max-width:46ch;line-height:1.5}
.hero-cards{--cw:clamp(20px,6.4vw,30px);display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:8px}
.mrow{display:flex;gap:calc(var(--cw)*.5);flex-wrap:nowrap}
.mletter{display:flex;gap:3px}
.hero-cards .card.joker .jtext{display:none}
.hero-cards .card.joker .jester{transform:scale(1.25)}

/* start-screen joker animations: one of seven plays at random every few seconds */
.hero-cards .card{--d:calc(var(--i,0)*45ms)}
.hero-cards.jx-wave .card{animation:jxWave .7s ease-in-out var(--d) both}
@keyframes jxWave{0%,100%{transform:none}40%{transform:translateY(-45%)}70%{transform:translateY(6%)}}
.hero-cards.jx-flip .card{animation:jxFlip .8s ease-in-out var(--d) both}
@keyframes jxFlip{from{transform:perspective(300px) rotateY(0)}to{transform:perspective(300px) rotateY(360deg)}}
.hero-cards.jx-spin .card{animation:jxSpin .9s cubic-bezier(.5,0,.3,1) var(--d) both}
@keyframes jxSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.hero-cards.jx-drop .card{animation:jxDrop .8s cubic-bezier(.3,1.5,.5,1) var(--d) both}
@keyframes jxDrop{0%{transform:translateY(-260%);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
.hero-cards.jx-morse .card{animation:jxMorse .5s ease-out var(--d) both}
.hero-cards.jx-morse .card.red{animation-duration:.3s}
@keyframes jxMorse{0%{opacity:.25;transform:none}35%{opacity:1;transform:scale(1.25);box-shadow:0 0 0 2px var(--accent),0 0 18px var(--accent)}100%{opacity:1;transform:none}}
.hero-cards.jx-jiggle .card{animation:jxJiggle .9s ease-in-out calc(var(--d)*.3) both}
@keyframes jxJiggle{0%,100%{transform:none}20%{transform:rotate(-16deg)}40%{transform:rotate(14deg)}60%{transform:rotate(-9deg)}80%{transform:rotate(5deg)}}
.hero-cards.jx-scatter .card{animation:jxScatter 1.4s cubic-bezier(.4,0,.2,1) calc(var(--d)*.2) both}
@keyframes jxScatter{0%,100%{transform:none}45%,55%{transform:translate(var(--dx,0),var(--dy,0)) rotate(var(--dr,0))}}
/* dot/dash swap: a few jokers trade colour mid-animation, then swap back */
.hero-cards .card.jswap{animation:jxSwap .5s ease-in-out both!important}
@keyframes jxSwap{0%{transform:perspective(300px) rotateY(0)}50%{transform:perspective(300px) rotateY(90deg)}100%{transform:perspective(300px) rotateY(0)}}
@media (prefers-reduced-motion:reduce){.hero-cards .card{animation:none!important}}
.hero-cards .card{box-shadow:0 0 0 1px rgba(0,0,0,.08),0 2px 5px rgba(0,0,0,.2)}
.panel{background:var(--panel);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px;box-shadow:inset 0 0 0 1px var(--line)}
.seg{display:inline-flex;flex-wrap:wrap;background:color-mix(in srgb,var(--ink) 7%,transparent);border-radius:999px;padding:3px;gap:2px}
.label.ctr{text-align:center}
.seg.ctr{align-self:center;justify-content:center}
.seg button{border:0;background:transparent;border-radius:999px;padding:7px 16px;font-family:var(--display);font-weight:700;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seat{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.seat .num{font-family:var(--display);font-weight:800;color:var(--muted);width:1.2em}
.seat input{min-width:0;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:9px 11px;color:var(--ink);font:inherit}
.note{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.note.warn{color:var(--bad)}
.joinrow{display:flex;gap:8px;flex-wrap:wrap}
.panel input.text{min-width:0;flex:1;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);font:inherit}
#ocode{letter-spacing:.3em;font-family:var(--display);font-weight:800;text-transform:uppercase;max-width:9em}
.bigcode{text-transform:uppercase;font-family:var(--display);font-weight:800;font-size:clamp(48px,16vw,72px);letter-spacing:.12em;color:var(--accent);line-height:1}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.plist li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-radius:12px;background:color-mix(in srgb,var(--ink) 5%,transparent)}
.toggle{display:flex;gap:10px;align-items:flex-start;cursor:pointer;line-height:1.4}
.toggle input{accent-color:var(--accent);width:18px;height:18px;margin-top:2px;flex:none}
.toggle small{color:var(--muted);display:block}

/* overlays */
.cover{position:fixed;inset:0;background:rgba(20,16,12,.55);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:20;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.cover-box{background:var(--panel);border-radius:22px;padding:26px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.35),inset 0 0 0 1px var(--line)}
.cover-box h2{font-size:28px}
.cover-box p{margin:0;color:var(--muted);line-height:1.5}
.ranks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ranks li{display:flex;gap:12px;align-items:center;padding:8px 12px;border-radius:12px;background:color-mix(in srgb,var(--ink) 5%,transparent);font-variant-numeric:tabular-nums}
.ranks li b{font-family:var(--display);width:2.2em;color:var(--muted)}
.ranks li.loser{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad);font-weight:700}
details.rules{color:var(--muted);font-size:14px;line-height:1.55}
details.rules summary{cursor:pointer;font-weight:700;color:var(--ink);text-align:center}
details.rules>p{text-align:center}
details.rules ul{padding-left:1.2em;margin:8px auto 0;max-width:65ch}

@media (max-width:520px){
  .centre{grid-template-columns:auto 1fr;gap:10px}
  .centre .need-col{grid-column:1/-1;order:3}
  .me{padding:12px}
}
/* app settings sheet, as in mods */
.sheet{position:fixed;inset:0;background:rgba(20,16,12,.45);display:flex;align-items:center;justify-content:center;padding:8px;z-index:30}
.sheet-card{background:var(--panel);color:var(--ink);border-radius:16px;padding:16px 18px 18px;width:100%;max-width:560px;max-height:92vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.25);zoom:var(--scale)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:1.1rem}
.sgroup{margin:4px 0 14px}
.sgroup>b{display:block;font-size:.95rem;margin-bottom:8px;text-align:center}
.sheet-card .glows,.sheet-card .backs,.sheet-card .srange{justify-content:center}
.sheet-card .tcap{text-align:center}
.sheet-head{position:relative;justify-content:center!important}
.sheet-head .iconbtn{position:absolute;right:0;top:50%;transform:translateY(-50%)}
.sheet-card>.btn{display:block;margin:0 auto}
.themes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tcol{display:flex;flex-direction:column;gap:6px}
.tcap{font-size:.75rem;color:var(--muted);letter-spacing:.1em}
.theme{font:inherit;font-size:.8rem;border-radius:12px;border:2px solid var(--line);padding:8px;cursor:pointer;text-align:left}
.theme.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.theme .dots{display:flex;gap:4px;margin-bottom:6px}
.theme .dots i{width:14px;height:14px;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.fonts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.fontbtn{font-size:1rem;padding:10px 8px;border-radius:10px;border:1.5px solid var(--line);background:var(--field);color:var(--ink);cursor:pointer;text-transform:none}
.fontbtn.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.glows{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.glowbtn{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.glowbtn.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent)}
.glowtxt,.pill{font:inherit;font-size:.82rem;padding:0 12px;border-radius:999px;border:2px solid var(--line);background:var(--field);color:var(--ink);cursor:pointer;height:34px}
.glowtxt.on,.pill.on{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.srange{display:flex;align-items:center;gap:10px}
.srange input{flex:1;accent-color:var(--accent)}
.srange span:last-child{min-width:3.2em;text-align:right;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const rn=r=>NAMES[r]||String(r);
const isRed=s=>s==='♥'||s==='♦';
const CPU_NAMES=['mAIm','bobAI','dobAI'];const OLD_CPU=['Rosa','Dev','Mags','mAIm 1','mAIm 2','mAIm 3','rosAI'];
let DELAY=900;

let S=null;                 // game state
let sel={zone:null,idx:[]}; // current selection
let pass=null;              // {pi, why} hand-over cover for pass-and-play
let timer=null;
let nudgeId=null;
let seenBurn=0;
let setup=loadSetup()||{count:3,seats:[{name:'You',type:'human'},{name:'mAIm',type:'cpu'},{name:'bobAI',type:'cpu'},{name:'dobAI',type:'cpu'}],seven:true,eights:true,jacks:true,jokers:true};
for(const k of ['eights','jacks','jokers'])if(setup[k]===undefined)setup[k]=true;

function loadSetup(){try{const x=JSON.parse(localStorage.getItem('shithead-setup'));if(!(x&&x.seats&&x.seats.length===4))return null;x.seats.forEach((st,k)=>{if(st.type==='cpu'&&(OLD_CPU.includes(st.name)||CPU_NAMES.includes(st.name)))st.name=CPU_NAMES[k-1]||st.name});return x}catch(e){return null}}
function saveSetup(){try{localStorage.setItem('shithead-setup',JSON.stringify(setup))}catch(e){}}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const sortHand=p=>p.hand.sort((a,b)=>a.r-b.r||a.s.localeCompare(b.s));
const humans=()=>S.players.map((p,i)=>p.type==='human'?i:-1).filter(i=>i>=0);
const multiHuman=()=>humans().length>1;
const zoneOf=p=>p.hand.length?'hand':p.up.length?'up':p.down.length?'down':null;
const invisible=r=>r===JOKER||(S.eights&&r===8);
function topRank(){for(let i=S.pile.length-1;i>=0;i--){const r=S.pile[i].r;if(!invisible(r))return r}return null}
function canPlay(r){
  const t=topRank();
  if(S.jacks&&t===11)return r>=11;
  if(r===2||r===10||invisible(r))return true;
  if(t===null)return true;
  if(S.seven&&t===7)return r<=7;
  return r>=t;
}
// each face-up card sits on the face-down card in the same slot (0-2); a face-down card with nothing on top is exposed
const slotOf=(c,i)=>c.slot??i;
function exposedDown(p){return p.down.map((c,i)=>i).filter(i=>!p.up.some((u,j)=>slotOf(u,j)===slotOf(p.down[i],i)))}
function hasMove(p){const z=zoneOf(p);if(!z)return false;if(z==='down')return true;if(z==='up'&&exposedDown(p).length)return true;return p[z].some(c=>canPlay(c.r))}
function cardName(c){return c.r===JOKER?'a joker':rn(c.r)+c.s}
function describe(cards){const r=cards[0].r;return cards.length===1?cardName(cards[0]):`${cards.length} × ${r===JOKER?'jokers':rn(r)}`}
function log(t){S.log.push(t);if(S.log.length>40)S.log.shift()}
function cardValue(c){return c.r===JOKER?18:c.r===10?17:c.r===2?16:invisible(c.r)?15:c.r}
const wild=r=>r===2||r===10||invisible(r);

/* ---------- game flow ---------- */
function buildGame(seats,rules){
  clearTimeout(timer);timer=null;
  const deck=[];let id=0;
  for(const s of SUITS)for(let r=2;r<=14;r++)deck.push({r,s,id:id++});
  if(rules.jokers){deck.push({r:JOKER,s:'★',jc:'red',id:id++},{r:JOKER,s:'★',jc:'black',id:id++})}
  shuffle(deck);
  S={players:seats.map((x,i)=>({name:(x.name||'').trim()||(x.type==='cpu'?CPU_NAMES[i-1]||'Computer':`Player ${i+1}`),type:x.type,uid:x.uid||null,hand:[],up:[],down:[],out:false})),
     deck,pile:[],burned:0,turn:0,phase:'swap',seven:rules.seven,eights:rules.eights,jacks:rules.jacks,jokers:rules.jokers,dir:1,finish:[],log:[],viewer:0,swapQ:[],flash:null,shithead:null,burnSeq:0,round:1,rev:0,level:rules.level||'normal',evs:[],evSeq:0};seenEv=0;
  for(const k of ['down','up','hand'])for(let i=0;i<3;i++)for(const p of S.players){const c=deck.pop();if(k!=='hand')c.slot=i;p[k].push(c)}
  S.players.forEach(p=>{if(p.type==='cpu')aiSwap(p);sortHand(p)});
}
/* step back: a copy of the game at the start of each person's turn (not in online games) */
let history=[];
function remember(){
  if(ON||!S)return;
  const snap=JSON.stringify(S);
  if(history[history.length-1]!==snap){history.push(snap);if(history.length>60)history.shift()}
}
function canStepBack(){
  if(ON||!S||S.phase==='swap')return false;
  const cur=JSON.stringify(S);
  return history.some(h=>h!==cur);
}
function stepBack(){
  if(!canStepBack())return;
  clearTimeout(timer);timer=null;
  const cur=JSON.stringify(S);
  while(history.length&&history[history.length-1]===cur)history.pop();
  const snap=history[history.length-1];
  if(!snap)return;
  S=JSON.parse(snap);sel={zone:null,idx:[]};pass=null;seenEv=S.evSeq||0;
  log('Stepped back to the start of '+(S.players[S.turn].name==='You'?'your':S.players[S.turn].name+"'s")+' turn.');
  history[history.length-1]=JSON.stringify(S);
  render();
}
function newGame(){
  history=[];
  buildGame(setup.seats.slice(0,setup.count),setup);
  S.swapQ=humans();
  S.viewer=S.swapQ[0]??0;
  sel={zone:null,idx:[]};
  pass=multiHuman()?{pi:S.viewer,why:'swap'}:null;
  log('Cards dealt. Swap hand and face-up cards, then start.');
  render();
}

function aiSwap(p){
  const all=[...p.hand,...p.up].sort((a,b)=>cardValue(b)-cardValue(a));
  p.up=all.slice(0,3);p.hand=all.slice(3);p.up.forEach((c,i)=>c.slot=i);p.hand.forEach(c=>delete c.slot);
}

function finishSwap(){
  S.swapQ.shift();
  sel={zone:null,idx:[]};
  if(S.swapQ.length){S.viewer=S.swapQ[0];pass={pi:S.viewer,why:'swap'};render();return}
  startPlay();
}

function startPlay(){
  S.phase='play';
  let best=null,bi=0;
  S.players.forEach((p,i)=>p.hand.forEach(c=>{if(!wild(c.r)&&(best===null||c.r<best)){best=c.r;bi=i}}));
  S.turn=bi;
  const fp=S.players[bi];
  log(`${fp.name} ${youVerb(fp,'have','has')} the lowest card${best?` (${rn(best)})`:''} and ${youVerb(fp,'go','goes')} first.`);
  beginTurn();
}

function beginTurn(){
  hintMsg='';
  const p=S.players[S.turn];
  S.moves=(S.moves||0)+1;
  sel={zone:null,idx:[]};
  if(ON){render();push();return}
  if(p.type==='cpu'){render();timer=setTimeout(aiMove,DELAY);return}
  if(S.viewer!==S.turn){S.viewer=S.turn;if(multiHuman())pass={pi:S.turn,why:'turn'}}
  render();
  remember();
}

function advance(){
  const n=S.players.length;
  const d=S.dir||1;
  do{S.turn=(S.turn+d+n)%n}while(S.players[S.turn].out);
  beginTurn();
}

function doPlay(pi,zone,idxs){
  const p=S.players[pi];
  const cards=[...idxs].sort((a,b)=>b-a).map(i=>p[zone].splice(i,1)[0]);
  S.pile.push(...cards);fx('play',{pi,n:cards.length});
  log(`${p.name} played ${describe(cards)}${zone==='up'?' from the table':''}.`);
  afterPlay(pi,cards,zone);
}

function afterPlay(pi,cards,zone){
  const p=S.players[pi];
  S.follow=null;
  let burn=null,again=false;
  if(cards[0].r===10)burn='A 10 burns the pile.';
  else{const n=S.pile.length;if(n>=4){const r=S.pile[n-1].r;if(S.pile.slice(-4).every(c=>c.r===r)){burn=`Four ${rn(r)}s in a row burn the pile.`;again=true}}}
  while(S.deck.length&&p.hand.length<3)p.hand.push(S.deck.pop());
  sortHand(p);
  if(burn){S.burned+=S.pile.length;S.pile=[];S.flash='burn';S.burnSeq=(S.burnSeq||0)+1;fx('burn',{pi});log(burn+(again&&!p.out?` ${p.name} ${youVerb(p,'go','goes')} again.`:''))}
  else if(cards[0].r===2){log('A 2 resets the pile.')}
  else if(cards[0].r===JOKER){
    const active=S.players.filter(x=>!x.out).length;
    if(active>2&&cards.length%2===1){S.dir=-(S.dir||1);fx('reverse',{pi});log('The joker reverses the direction of play.')}
    else log('The joker is invisible.')
  }
  else if(cards[0].r===8&&S.eights){log('The 8 is invisible.')}
  checkOut(pi);
  if(endCheck())return;
  // jacks that were your last cards (nothing left in that hand or row) need no follow-up: the next player plays on the jack
  const lastCards=p.out||(zone&&!p[zone].length);
  if(!burn&&S.jacks&&cards[0].r===11&&lastCards){S.follow='next';log(`Those were ${p.name==='You'?'your':p.name+"'s"} last cards, so no follow-up is needed. Next player: J, Q, K, A or joker.`)}
  if(!burn&&S.jacks&&cards[0].r===11&&!lastCards){
    S.follow=pi;
    log(`${p.name} ${youVerb(p,'must','must')} follow the jack with a J, Q, K, A or joker.`);
    beginTurn();return;
  }
  if(again&&!p.out)beginTurn();else advance();
}
function youVerb(p,a,b){return p.name==='You'?a:b}

function checkOut(pi){
  const p=S.players[pi];
  if(!p.out&&!p.hand.length&&!p.up.length&&!p.down.length&&!S.deck.length){
    p.out=true;S.finish.push(pi);fx('out',{pi});
    log(`${p.name} ${youVerb(p,'are','is')} out in place ${S.finish.length}.`);
  }
}
function endCheck(){
  const left=S.players.map((p,i)=>p.out?-1:i).filter(i=>i>=0);
  if(left.length<=1){
    S.phase='over';S.shithead=left[0]??null;pass=null;fx('over',{sh:S.shithead});
    if(left.length)log(`${S.players[left[0]].name} ${youVerb(S.players[left[0]],'are','is')} the shithead.`);
    render();if(ON)push();return true;
  }
  return false;
}

function pickUp(pi){
  S.follow=null;
  const p=S.players[pi];const n=S.pile.length;
  fx('pickup',{pi,n});p.hand.push(...S.pile);S.pile=[];sortHand(p);
  log(`${p.name} ${youVerb(p,'pick','picks')} up the pile (${n} card${n===1?'':'s'}).`);
  advance();
}

function flip(pi,idx){
  const p=S.players[pi];
  const c=p.down.splice(idx,1)[0];
  if(canPlay(c.r)){
    S.pile.push(c);fx('play',{pi,n:1});log(`${p.name} flipped ${cardName(c)} blind and it plays.`);afterPlay(pi,[c],'down');
  }else{
    S.pile.push(c);const n=S.pile.length;fx('pickup',{pi,n});
    p.hand.push(...S.pile);S.pile=[];sortHand(p);
    log(`${p.name} flipped ${cardName(c)} blind. It can't go, so ${youVerb(p,'you pick','they pick')} up ${n} cards.`);
    advance();
  }
}

/* ---------- computer player ---------- */
function aiMove(){
  if(!S||S.phase!=='play')return;
  const pi=S.turn,p=S.players[pi];
  if(p.type!=='cpu')return;
  const m=aiChoice(pi,S.level||'normal');
  if(m.kind==='flip')flip(pi,m.idx);else if(m.kind==='pickup')pickUp(pi);else doPlay(pi,m.zone,m.idx);
}
function nextNearlyOut(){
  const n=S.players.length,d=S.dir||1;let t=S.turn;
  do{t=(t+d+n)%n}while(S.players[t].out&&t!==S.turn);
  const q=S.players[t];return !S.deck.length&&q.hand.length+q.up.length+q.down.length<=4;
}
// level: easy | normal | nasty; calm=true gives the best move with no randomness (used for hints)
function aiChoice(pi,level,calm){
  const p=S.players[pi];
  const z=zoneOf(p);
  if(z==='down')return{kind:'flip',idx:Math.floor(Math.random()*p.down.length)};
  if(z==='up'&&!p.up.some(c=>canPlay(c.r))){const ex=exposedDown(p);if(ex.length)return{kind:'flip',idx:ex[Math.floor(Math.random()*ex.length)]};}
  const cards=p[z];
  const ranks=[...new Set(cards.filter(c=>canPlay(c.r)).map(c=>c.r))];
  if(!ranks.length)return{kind:'pickup'};
  // a jack has to be followed straight away, so only lay one when a follow-up is in the same cards
  const canFollowJack=cards.some(c=>c.r>=12)||cards.every(c=>c.r===11); // jacks as your last cards need no follow-up
  let normal=ranks.filter(r=>!wild(r)).sort((a,b)=>a-b);
  if(S.jacks&&!canFollowJack&&normal.includes(11)&&ranks.length>1)normal=normal.filter(r=>r!==11);
  if(S.jacks&&S.follow===pi&&normal.some(r=>r!==11))normal=normal.filter(r=>r!==11);
  let r;
  // a little randomness stops two computer players repeating the same pattern for ever
  const late=(S.moves||0)>150; // long games get more random so computer players can't loop for ever
  const chaos=calm?0:late?0.6:level==='nasty'?0.04:level==='easy'?0.35:0.15;
  if(level==='easy'&&!calm&&!late&&Math.random()<0.45)r=ranks[Math.floor(Math.random()*ranks.length)];
  else if(normal.length>1&&Math.random()<chaos)r=normal[1+Math.floor(Math.random()*(normal.length-1))];
  // nasty: when the next player is nearly out, hit them with a 7 or the highest card it can
  else if(level==='nasty'&&!late&&normal.length>1&&nextNearlyOut())r=S.seven&&normal.includes(7)?7:normal[normal.length-1];
  else if(normal.length&&!(S.pile.length>=6&&ranks.includes(10)&&normal[0]>=11))r=normal[0];
  else if(ranks.includes(10)&&(S.pile.length>=4||ranks.length===1))r=10;
  else r=[2,8,JOKER,10].find(x=>ranks.includes(x));
  const idx=cards.map((c,i)=>c.r===r?i:-1).filter(i=>i>=0);
  if(level==='easy'&&!calm&&idx.length>1&&Math.random()<0.4)idx.length=1;
  return{kind:'play',zone:z,idx};
}


/* ---------- human input ---------- */
function onCard(zone,i){
  if(pass||!S)return;
  hintMsg='';
  const p=S.players[S.viewer];
  if(S.phase==='swap'){
    if(zone!=='hand'&&zone!=='up')return;
    if(ON&&ON.readyRound===S.round)return;
    if(sel.zone&&sel.zone!==zone){
      const hi=zone==='hand'?i:sel.idx[0],ui=zone==='up'?i:sel.idx[0];
      const sl=slotOf(p.up[ui],ui);[p.hand[hi],p.up[ui]]=[p.up[ui],p.hand[hi]];p.up[ui].slot=sl;delete p.hand[hi].slot;sortHand(p);sel={zone:null,idx:[]};
    }else if(sel.zone===zone&&sel.idx[0]===i){sel={zone:null,idx:[]}}
    else sel={zone,idx:[i]};
    render();return;
  }
  if(S.phase!=='play'||S.turn!==S.viewer||p.type!=='human')return;
  const z=zoneOf(p);
  if(zone==='down'&&z==='up'&&exposedDown(p).includes(i)){flip(S.viewer,i);return}
  if(zone!==z){nudge(zone,i);return}
  if(z==='down'){flip(S.viewer,i);return}
  const c=p[z][i];
  // cacky jack: with jack(s) selected, tap a Q, K, A or joker to play it on top in the same go
  if(S.jacks&&sel.zone===z&&sel.idx.length&&p[z][sel.idx[0]].r===11&&c.r>=12){
    if(sel.fr===c.r){sel.fids=sel.fids.includes(c.id)?sel.fids.filter(x=>x!==c.id):[...sel.fids,c.id]}
    else{sel.fr=c.r;sel.fids=p[z].filter(x=>x.r===c.r).map(x=>x.id)}
    if(!sel.fids.length){delete sel.fids;delete sel.fr}
    render();return;
  }
  if(!canPlay(c.r)){nudge(zone,i);return}
  if(sel.zone===z&&sel.idx.length&&p[z][sel.idx[0]].r===c.r){
    sel.idx=sel.idx.includes(i)?sel.idx.filter(x=>x!==i):[...sel.idx,i];
    if(!sel.idx.length)sel.zone=null;
  }else{
    sel={zone:z,idx:p[z].map((x,j)=>x.r===c.r?j:-1).filter(j=>j>=0)};
  }
  render();
}
function nudge(zone,i){nudgeId=zone+':'+i;render();nudgeId=null}

function act(a,el){
  if(a==='players'){setup.count=+el.dataset.n;saveSetup();render();return}
  if(a==='seat-type'){const k=+el.dataset.k;const s=setup.seats[k];s.type=s.type==='cpu'?'human':'cpu';if(s.type==='cpu'&&(!s.name||/^Player \d$/.test(s.name)))s.name=CPU_NAMES[k-1];if(s.type==='human'&&CPU_NAMES.includes(s.name))s.name=`Player ${k+1}`;saveSetup();render();return}
  if(a==='mode'&&el.dataset.m==='online'){setup.online=true;saveSetup();render();return}
  if(a==='mode'){setup.online=false;const h=el.dataset.m==='people';for(let k=1;k<4;k++){const st=setup.seats[k];st.type=h?'human':'cpu';st.name=h?`Player ${k+1}`:CPU_NAMES[k-1]}if(h&&setup.seats[0].name==='You')setup.seats[0].name='Player 1';if(!h&&setup.seats[0].name==='Player 1')setup.seats[0].name='You';saveSetup();render();return}
  if(a==='level'){setup.level=el.dataset.l;saveSetup();render();return}
  if(a==='shame-reset'){saveShame({});render();return}
  if(a==='hint'){showHint();return}
  if(a==='emote'){sendEmote(el.dataset.e);return}
  if(['seven','eights','jacks','jokers'].includes(a)){setup[a]=el.checked;saveSetup();return}
  if(a==='deal'){saveSetup();newGame();return}
  if(a==='undo'){stepBack();return}
  if(a==='settings'){renderAppSettings();document.getElementById('settingsSheet').hidden=false;return}
  if(a==='menu'){clearTimeout(timer);timer=null;S=null;pass=null;render();return}
  if(a==='again'){newGame();return}
  if(a==='reveal'){pass=null;render();return}
  if(a==='swap-done'){if(ON)onlineReady();else finishSwap();return}
  if(a==='create'){createGame();return}
  if(a==='join'){joinGame(document.getElementById('ocode').value);return}
  if(a==='rejoin'){joinGame(savedCode());return}
  if(a==='leave'){leaveOnline();return}
  if(a==='add-cpu'){if(ON&&ON.game)ON.ref.update({cpus:Math.min(3,(ON.game.cpus||0)+1)}).catch(onErr);return}
  if(a==='del-cpu'){if(ON&&ON.game)ON.ref.update({cpus:Math.max(0,(ON.game.cpus||0)-1)}).catch(onErr);return}
  if(a==='start-online'){hostStart();return}
  if(a==='again-online'){hostAgain();return}
  if(a==='play'){
    if(!(sel.idx.length&&S.turn===S.viewer))return;
    const fids=sel.fids;doPlay(S.viewer,sel.zone,sel.idx);
    if(fids&&S.phase==='play'&&S.turn===S.viewer&&S.follow===S.viewer){
      const p=S.players[S.viewer],z=zoneOf(p);
      const idx=z&&z!=='down'?p[z].map((c,i)=>fids.includes(c.id)?i:-1).filter(i=>i>=0):[];
      if(idx.length&&idx.every(i=>canPlay(p[z][i].r)))doPlay(S.viewer,z,idx);
    }
    return}
  if(a==='pickup'){if(S.turn===S.viewer)pickUp(S.viewer);return}
  if(a==='clear'){sel={zone:null,idx:[]};render();return}
}

document.addEventListener('click',e=>{
  const c=e.target.closest('[data-z]');
  if(c){
    const k=c.dataset.z+':'+c.dataset.i,now=Date.now();
    if(lastTap.k===k&&now-lastTap.t<400&&e.detail>=2&&quickPlay(c.dataset.z,+c.dataset.i)){lastTap={k:'',t:0};return}
    lastTap={k,t:now};onCard(c.dataset.z,+c.dataset.i);return}
  const b=e.target.closest('[data-act]');
  if(b&&b.type!=='checkbox')act(b.dataset.act,b);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='ocode'){act('join',e.target);return}
  if(e.target.matches&&e.target.matches('input,textarea'))return;
  if(!S)return;
  const click=sel=>{const b=document.querySelector(sel);if(b&&!b.disabled){e.preventDefault();b.click();return true}return false};
  if(e.key==='Enter'||e.key===' '){click('[data-act=reveal]')||click('[data-act=play]')||click('[data-act=pickup]')||click('[data-act=swap-done]')}
  else if(e.key==='p'||e.key==='P')click('[data-act=pickup]');
  else if(e.key==='Escape')click('[data-act=clear]');
  else if((e.key==='z'||e.key==='Z')&&(e.ctrlKey||e.metaKey)){e.preventDefault();stepBack()}
});
let lastTap={k:'',t:0};
function quickPlay(z,i){
  if(!S||pass||S.phase!=='play'||S.turn!==S.viewer)return false;
  const p=S.players[S.viewer];if(z!==zoneOf(p)||z==='down')return false;
  const card=p[z][i];if(!card||!canPlay(card.r))return false;
  doPlay(S.viewer,z,p[z].map((x,j)=>x.r===card.r?j:-1).filter(j=>j>=0));return true;
}
document.addEventListener('change',e=>{
  if(e.target.type==='checkbox')act(e.target.dataset.act,e.target);
});
document.addEventListener('input',e=>{
  if(e.target.id==='oname')saveName(e.target.value);
  if(e.target.id==='ocode')e.target.value=e.target.value.toUpperCase().replace(/[^A-Z]/g,'');
  if(e.target.dataset.seat!=null){setup.seats[+e.target.dataset.seat].name=e.target.value;saveSetup()}
});

/* ---------- rendering ---------- */
function cardHTML(c,o={}){
  const special=c.r===2||c.r===10||(S&&S.seven&&c.r===7)||(S&&S.eights&&c.r===8)||(S&&S.jacks&&c.r===11);
  const cls=['card',(isRed(c.s)||(c.r===JOKER&&jokerRed(c)))?'red':'',special?'special':'',c.r===JOKER?'joker':'',o.cls||''].join(' ');
  const attrs=o.zone!=null?` data-z="${o.zone}" data-i="${o.i}"`:'';
  const style=o.style?` style="${o.style}"`:'';
  const tag=o.zone!=null?'button':'div';
  return `<${tag} class="${cls}"${attrs}${style} aria-label="${c.r===JOKER?(jokerRed(c)?'Red joker':'Black joker'):rn(c.r)+' of '+suitName(c.s)}">${c.r===JOKER?'<svg class="jester" viewBox="0 0 100 140" aria-hidden="true"><g class="jtext" font-weight="800" font-size="11" text-anchor="middle" fill="currentColor" font-family="var(--display)"><text x="10" y="16">J</text><text x="10" y="27">O</text><text x="10" y="38">K</text><text x="10" y="49">E</text><text x="10" y="60">R</text><g transform="rotate(180 50 70)"><text x="10" y="16">J</text><text x="10" y="27">O</text><text x="10" y="38">K</text><text x="10" y="49">E</text><text x="10" y="60">R</text></g></g><g stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"><path d="M36 66 C28 54 20 48 15 34 C27 39 37 47 45 60 Z" fill="currentColor"/><path d="M64 66 C72 54 80 48 85 34 C73 39 63 47 55 60 Z" fill="currentColor"/><path d="M43 62 C45 47 48 37 50 25 C52 37 55 47 57 62 Z" fill="var(--face)"/><circle cx="15" cy="32" r="4.2" fill="var(--face)"/><circle cx="85" cy="32" r="4.2" fill="var(--face)"/><circle cx="50" cy="22" r="4.2" fill="currentColor"/><path d="M33 67 Q50 57 67 67 L67 72 Q50 63 33 72 Z" fill="currentColor"/><circle cx="50" cy="83" r="14.5" fill="var(--face)"/><path d="M42.5 80 l2 -3 l2 3 l-2 3 Z M53.5 80 l2 -3 l2 3 l-2 3 Z" fill="currentColor" stroke-width="1"/><path d="M42 87 Q50 95 58 87" fill="none"/><path d="M31 100 L37 110 L43 101 L50 112 L57 101 L63 110 L69 100 Q50 104 31 100 Z" fill="currentColor"/><circle cx="37" cy="112" r="2.6" fill="var(--face)"/><circle cx="50" cy="114.5" r="2.6" fill="var(--face)"/><circle cx="63" cy="112" r="2.6" fill="var(--face)"/></g></svg>':`<span class="ix">${rn(c.r)}<i>${c.s}</i></span><span class="pip">${c.s}</span>`}</${tag}>`;
}
// two jokers: one red, one black
const jokerRed=c=>c.jc?c.jc==='red':c.id%2===0;
// start-screen logo: "shithead" in morse code laid out in jokers, red joker = dot, black joker = dash
const MORSE_ROWS=[[['s','...'],['h','....'],['i','..'],['t','-']],[['h','....'],['e','.'],['a','.-'],['d','-..']]];
function morseLogoHTML(){
  return MORSE_ROWS.map(row=>`<div class="mrow">${row.map(([l,code])=>`<div class="mletter" title="${l}">${[...code].map(ch=>cardHTML({r:JOKER,s:'★',jc:ch==='.'?'red':'black'})).join('')}</div>`).join('')}</div>`).join('');
}
function backHTML(o={}){
  const tag=o.zone!=null?'button':'div';
  const attrs=o.zone!=null?` data-z="${o.zone}" data-i="${o.i}" aria-label="Face-down card ${o.i+1}"`:' aria-hidden="true"';
  return `<${tag} class="card back ${o.cls||''}"${attrs}${o.style?` style="${o.style}"`:''}></${tag}>`;
}
function suitName(s){return{'♠':'spades','♥':'hearts','♦':'diamonds','♣':'clubs'}[s]}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const openCards=()=>appSet.debug==='on'&&!ON;
function jackFollowable(c,zone){return !!(S&&S.jacks&&sel.zone===zone&&sel.idx.length&&S.players[S.viewer][zone][sel.idx[0]]&&S.players[S.viewer][zone][sel.idx[0]].r===11&&c.r>=12)}
function slotsHTML(p,interactive,zoneActive){
  let h='<div class="slots">';
  const ex=zoneActive==='up'?exposedDown(p):[];
  for(let k=0;k<3;k++){
    h+='<div class="slot">';
    const di=p.down.findIndex((c,i)=>slotOf(c,i)===k),ui=p.up.findIndex((c,i)=>slotOf(c,i)===k);
    if(di>=0){
      const act=interactive&&(zoneActive==='down'||ex.includes(di));
      const dcls='d '+(act?'ok':interactive&&p.up.length?'':(interactive&&zoneActive?'dim':''));
      h+=openCards()?cardHTML(p.down[di],{cls:dcls+' peek',zone:act?'down':null,i:di}):backHTML({cls:dcls,zone:act?'down':null,i:di});
    }else h+='<div class="placeholder d"></div>';
    if(ui>=0){
      const c=p.up[ui],i=ui;let cls='u';
      if(interactive){
        if(S.phase==='swap')cls+=' ok'+(sel.zone==='up'&&sel.idx[0]===i?' swapsel':'');
        else if(zoneActive==='up')cls+=canPlay(c.r)||jackFollowable(c,'up')?' ok':' dim';
        if(S.phase==='play'&&(sel.zone==='up'&&sel.idx.includes(i)||(sel.fids||[]).includes(c.id)))cls+=' sel';
        if(nudgeId==='up:'+i)cls+=' nudge';
      }
      h+=cardHTML(c,{cls,zone:interactive?'up':null,i});
    }
    h+='</div>';
  }
  return h+'</div>';
}

function wildText(){const w=['2s','10s'];if(S.eights)w.push('8s');if(S.jokers)w.push('jokers');return w.slice(0,-1).join(', ')+' and '+w[w.length-1]}
function effTop(){for(let i=S.pile.length-1;i>=0;i--){if(!invisible(S.pile[i].r))return S.pile[i]}return null}
function needText(){
  const t=topRank();
  const top=S.pile.length?S.pile[S.pile.length-1].r:null;
  const under=effTop();
  const inv=top!==null&&invisible(top)?(under?`The ${top===JOKER?'joker':'8'} on top is see-through, so you're playing on the ${cardName(under)}. `:`The ${top===JOKER?'joker':'8'} on top is see-through. `):'';
  if(S.jacks&&t===11&&S.follow!=null&&S.follow===S.turn)return['Follow the jack',inv+(S.players[S.turn].type==='cpu'?`${S.players[S.turn].name} must`:'Now')+' play a J, Q, K, A or joker on it, or pick up'];
  if(S.jacks&&t===11)return['J, Q, K, A or joker',inv+'Cacky jack: no 2s, 8s or 10s on it'];
  if(t===null)return['Any card',inv||'The pile is empty'];
  if(t===2)return['Any card',inv+'A 2 reset the pile'];
  if(S.seven&&t===7)return['7 or lower',inv+wildText()+' also play'];
  return[`${rn(t)} or higher`,inv+wildText()+' play on anything'];
}

function renderSetup(){
  const n=setup.count;
  let seats='';
  for(let k=0;k<n;k++){
    const s=setup.seats[k];
    seats+=`<div class="seat"><span class="num">${k+1}</span><input id="seat-${k}" data-seat="${k}"${/mAIm|rosAI|bobAI|dobAI/.test(s.name)?' class="maim"':''} value="${esc(s.name)}" maxlength="14" aria-label="Seat ${k+1} name">${k===0?'<span class="chip">Person</span>':`<button class="btn ghost sm" data-act="seat-type" data-k="${k}">${s.type==='cpu'?'Computer':'Person'}</button>`}</div>`;
  }
  const hum=setup.seats.slice(0,n).filter(s=>s.type==='human').length;
  const allPeople=hum===n,allCpu=hum===1,online=!!setup.online;
  return `<div class="setup">
    <div class="hero">
      <div class="hero-cards" role="img" aria-label="shithead in morse code, red jokers for dots and black jokers for dashes">${morseLogoHTML()}</div>
      <h1>Shithead</h1>
      <p>Get rid of every card in your hand, then the three on the table, then the three you can't see. Whoever is left holding cards loses.</p>
    </div>
    <div class="panel">
      <div class="label ctr">Play against</div>
      <div class="seg ctr" role="group" aria-label="Play against"><button data-act="mode" data-m="cpu" aria-pressed="${!online&&allCpu}">Computer</button><button data-act="mode" data-m="people" aria-pressed="${!online&&allPeople}">Friends, one phone</button><button data-act="mode" data-m="online" aria-pressed="${online}">Online</button></div>
      ${online?onlinePanelHTML():`
      <div class="label ctr">Players</div>
      <div class="seg ctr" role="group" aria-label="Number of players">${[2,3,4].map(k=>`<button data-act="players" data-n="${k}" aria-pressed="${k===n}">${k}</button>`).join('')}</div>
      ${seats}
      <p style="margin:0;color:var(--muted);font-size:13px;line-height:1.5">${hum>1?`${hum} people will pass one device between turns. Hands are hidden until each player taps to reveal.`:'You can also mix: tap Computer or Person beside a seat to switch it.'}</p>`}
    </div>
    <div class="panel">
      ${togglesHTML()}
    </div>
    ${online?'':'<div class="actions center"><button class="btn" data-act="deal">Deal cards</button></div>'}
    ${shameHTML()}
    ${rulesHTML()}
  </div>`;
}

function togglesHTML(){
  const lv=setup.level||'normal';
  return `<div class="label ctr">Computer level</div><div class="seg ctr" role="group" aria-label="Computer level">${['easy','normal','nasty'].map(k=>`<button data-act="level" data-l="${k}" aria-pressed="${k===lv}">${k}</button>`).join('')}</div>
      <label class="toggle"><input type="checkbox" id="seven" data-act="seven" ${setup.seven?'checked':''}><span>7 means 7 or lower<small>After a 7, the next player must play a 7 or lower. The magic cards (2, 8, 10 and jokers) still go on it.</small></span></label>
      <label class="toggle"><input type="checkbox" id="eights" data-act="eights" ${setup.eights?'checked':''}><span>8s are invisible<small>An 8 plays on anything, and the next player plays on the card beneath it.</small></span></label>
      <label class="toggle"><input type="checkbox" id="jacks" data-act="jacks" ${setup.jacks?'checked':''}><span>Cacky jack<small>Whoever lays a jack (or several) must straight away lay a J, Q, K, A or joker on top, one or more of a rank. If they can't, they pick up the pile, unless the jacks were their last cards. 2s, 8s and 10s never go on a jack.</small></span></label>
      <label class="toggle"><input type="checkbox" id="jokers" data-act="jokers" ${setup.jokers?'checked':''}><span>Jokers<small>Two jokers in the deck. A joker is invisible, plays on anything, and with 3 or more players it reverses the direction of play.</small></span></label>`;
}
function rulesHTML(){
  return `<details class="rules"><summary>How to play</summary><ul>
    <li>Everyone gets 3 face-down cards, 3 face-up cards on top of them, and 3 in hand. Before play, swap cards between your hand and your face-up cards. High cards, 2s and 10s make good face-up cards.</li>
    <li>On your turn, play a card of equal or higher rank than the top of the pile. Play several of the same rank together if you like.</li>
    <li>If you can't play, you pick up the whole pile.</li>
    <li>While the deck lasts, your hand refills to 3. Once your hand is empty, play your face-up cards. You can also flip any face-down card that no longer has a face-up card on top of it. A blind card that can't go means picking up the pile.</li>
    <li>A 2 resets the pile. A 10 burns it, and play passes on. Four of the same rank in a row also burns it, and then you go again.</li>
    <li>With the 7 rule on, a 7 forces the next player to play 7 or lower.</li>
    <li>With invisible 8s on, an 8 plays on anything and the next player plays on the card beneath it.</li>
    <li>Cacky jack: whoever lays a jack (or several jacks) must follow it straight away, in the same turn, with a J, Q, K, A or joker. Several of one rank are fine, such as two jacks then two queens. Following with another jack means following again. If you can't follow, you pick up the pile. The exception: jacks that are your last cards can be laid whenever they're allowed, with no follow-up, and the next player plays on the jack. 2s, 8s and 10s can never go on a jack, even with a joker on top of it.</li>
    <li>With jokers on, a joker is see-through like an 8: it plays on anything and the next player plays against the card beneath it. A joker can follow a jack, but the jack still shows through, so the next player must also play a J, Q, K, A or joker. With 3 or more players left it also reverses the direction of play.</li>
    <li>The last player still holding cards is the shithead.</li>
  </ul><p style="margin:8px 0 0">On a computer: double-click a card to play it, Enter plays your selection, P picks up the pile, Esc clears your selection.</p></details>`;
}

function oppHTML(i){
  const p=S.players[i];
  const place=S.finish.indexOf(i);
  const status=p.out?`<span class="chip out">Out · ${ordinal(place+1)}</span>`:S.turn===i&&S.phase==='play'?'<span class="chip turn">Playing</span>':p.type==='cpu'?'<span class="chip cpu">Computer</span>':'<span class="chip">Person</span>';
  const fan=openCards()?p.hand.map(c=>cardHTML(c)).join(''):p.hand.slice(0,6).map(()=>backHTML()).join('');
  return `<div class="opp ${S.turn===i&&S.phase==='play'&&!p.out?'active':''}" data-pi="${i}">
    <div class="opp-head"><h3>${esc(p.name)}</h3>${status}</div>
    <div class="opp-body">
      <div class="zone"><span class="label">Hand</span><div class="fan">${fan||'<div class="placeholder"></div>'}<span class="count">${p.hand.length}</span></div></div>
      <div class="zone"><span class="label">Table</span>${slotsHTML(p,false)}</div>
    </div></div>`;
}
function ordinal(n){return n+(['th','st','nd','rd'][n]||'th')}

function renderGame(){
  const v=S.viewer,me=S.players[v];
  const n=S.players.length;
  const order=[];for(let k=1;k<n;k++)order.push((v+k)%n);
  const myTurn=S.phase==='play'&&S.turn===v&&me.type==='human';
  const z=zoneOf(me);
  const [need,needSub]=needText();
  const pileCards=S.pile.slice(-5);
  // when 8s or jokers sit on top, fan them out so the card they're see-through to stays visible, and ring it
  const eff=effTop(),ek=pileCards.indexOf(eff),seeThrough=eff&&ek<pileCards.length-1;
  const pile=pileCards.map((c,k)=>{const rot=seeThrough&&k>ek?((c.id*37)%9)-4:((c.id*37)%15)-7;const after=seeThrough?Math.max(0,k-ek):0;const dx=(k-(pileCards.length-1))*10+(seeThrough?(after-(pileCards.length-1-ek))*28:0);return cardHTML(c,{cls:seeThrough&&k===ek?'under':'',style:`transform:translateX(${dx}px) translateY(${seeThrough&&k>ek?8:0}px) rotate(${rot}deg)`})}).join('');
  const flash=S.flash==='burn'||(S.burnSeq&&S.burnSeq!==seenBurn);seenBurn=S.burnSeq;

  let prompt='',actions='';
  if(S.phase==='swap'){
    if(ON&&ON.readyRound===S.round){
      const w=S.players.filter(p=>p.type==='human'&&((ON.seats.find(x=>x.uid===p.uid)||{}).ready!==S.round)).map(p=>esc(p.name));
      prompt=w.length?`Ready. Waiting for ${w.join(', ')} to finish swapping.`:'Everyone is ready. Starting…';actions='';
    }else{
    prompt=sel.zone?`Now tap a ${sel.zone==='hand'?'face-up':'hand'} card to swap it.`:'Tap a hand card and a face-up card to swap them.';
    actions=`<button class="btn" data-act="swap-done">${ON?"I'm ready":S.swapQ.length>1?'Done, next player':'Start game'}</button>`;
    }
  }else if(myTurn){
    const can=hasMove(me);
    if(!can)prompt=`Nothing you hold can go on ${rn(topRank())}. Pick up the pile.`;
    else if(z==='down')prompt='Flip one of your face-down cards. Good luck.';
    else if(sel.idx.length)prompt=sel.fids?`Play ${sel.idx.length} × J, then ${sel.fids.length} × ${rn(sel.fr)} on top?`:S.jacks&&me[z][sel.idx[0]].r===11&&me[z].some(c=>c.r>=12)?'Jack selected. Tap a Q, K, A or joker to follow it in the same go, or play the jack on its own and follow after.':`Play ${sel.idx.length} × ${rn(me[z][sel.idx[0]].r)}? Tap a card to leave it out.`;
    else prompt=z==='up'?(exposedDown(me).length?'Play a face-up card, or flip a face-down card that has nothing on top of it.':'Your hand is empty. Play from your face-up cards.'):'Your turn. Tap a card to select it, or double-click to play it straight away.';
    if(hintMsg&&can){prompt=hintMsg}
    actions=can?(z==='down'?'':`<button class="btn ghost" data-act="hint" title="Show the best play">💡 Hint</button><button class="btn" data-act="play" ${sel.idx.length?'':'disabled'}>Play${sel.idx.length?` ${sel.idx.length} × ${rn(me[z][sel.idx[0]].r)}`:''}${sel.fids?` + ${sel.fids.length} × ${rn(sel.fr)}`:''}</button>${sel.idx.length?'<button class="btn ghost" data-act="clear">Clear</button>':''}`)
               :`<button class="btn warn" data-act="pickup">Pick up ${S.pile.length} card${S.pile.length===1?'':'s'}</button>`;
  }else if(S.phase==='play'){
    prompt=me.out?`You're out in ${ordinal(S.finish.indexOf(v)+1)} place. Watching the rest.`:`Waiting for ${esc(S.players[S.turn].name)}…`;
  }

  const hand=me.hand.map((c,i)=>{
    let cls='';
    if(S.phase==='swap'){cls='ok'+(sel.zone==='hand'&&sel.idx[0]===i?' swapsel':'')}
    else if(myTurn&&z==='hand'){cls=canPlay(c.r)||jackFollowable(c,'hand')?'ok':'dim';if(sel.zone==='hand'&&sel.idx.includes(i)||(sel.fids||[]).includes(c.id))cls+=' sel'}
    if(nudgeId==='hand:'+i)cls+=' nudge';
    return cardHTML(c,{cls,zone:'hand',i});
  }).join('');

  const meStatus=me.out?`<span class="chip out">Out · ${ordinal(S.finish.indexOf(v)+1)}</span>`:myTurn?'<span class="chip turn">Your turn</span>':'';
  const deckTop=S.deck.length?backHTML()+(S.deck.length>1?backHTML():''):'<div class="placeholder"></div>';

  topActions=ON?`<span class="chip">Game ${ON.code}</span><button class="btn ghost sm" data-act="leave">Leave</button>`:(canStepBack()?'<button class="btn ghost sm" data-act="undo" title="Undo your last turn (Ctrl+Z)">↶ step back</button>':'')+'<button class="btn ghost sm" data-act="menu">New game</button>';
  let html=`
  ${onlineMsg?`<div class="note warn">${esc(onlineMsg)}</div>`:''}
  <section class="opps" aria-label="Opponents">${order.map(oppHTML).join('')}</section>
  <section class="centre">
    <div class="stack"><div class="deckpile">${deckTop}</div><span class="label">Deck · ${S.deck.length}</span>${S.dir===-1?'<span class="label" style="color:var(--accent)">Reversed</span>':''}</div>
    <div class="pilewrap"><div class="pile ${flash?'burn':''}">${pile||'<div class="placeholder"></div>'}</div><span class="label">Pile · ${S.pile.length}${S.burned?` · Burned ${S.burned}`:''}</span>${seeThrough?`<span class="label undertag">Playing on ${esc(cardName(eff))}</span>`:''}</div>
    <div class="need-col"><div class="flash">${flash?'Burned':''}</div><div class="need">${S.phase==='play'?need:'Swap phase'}<small>${S.phase==='play'?needSub:'Set up your face-up cards'}</small></div></div>
  </section>
  <div class="log" aria-live="polite">${S.log.slice(-3).map(t=>`<div>${esc(t)}</div>`).join('')}</div>
  <section class="me ${myTurn||S.phase==='swap'?'active':''}">
    <div class="me-head"><h2>${esc(me.name)}</h2>${meStatus}</div>
    <div class="prompt">${prompt}</div>
    <div class="me-row">
      <div class="zone"><span class="label">Table</span>${slotsHTML(me,true,myTurn?z:null)}</div>
      <div class="zone" style="flex:1"><span class="label">Hand · ${me.hand.length}</span><div class="hand ${me.hand.length>12?'tight':''}">${hand||'<div class="placeholder"></div>'}</div></div>
    </div>
    <div class="actions">${actions}</div>
  </section>
  ${ON&&S.viewer>=0?`<div class="emotes" role="group" aria-label="Send a reaction">${emotes().map(e=>`<button class="emote" data-act="emote" data-e="${e}" aria-label="Send ${e}">${e}</button>`).join('')}</div>`:''}
  ${rulesHTML()}`;
  S.flash=null;

  if(pass){
    const p=S.players[pass.pi];
    html+=`<div class="cover"><div class="cover-box"><span class="label">${pass.why==='swap'?'Set-up':'Next turn'}</span><h2>Pass to ${esc(p.name)}</h2><p>${pass.why==='swap'?'Everyone else look away while they arrange their face-up cards.':'Everyone else look away. Their hand shows once they tap below.'}</p><button class="btn" data-act="reveal">I'm ${esc(p.name)}, show my cards</button></div></div>`;
  }
  if(S.phase==='over'){
    const ranks=S.finish.map((pi,k)=>`<li><b>${ordinal(k+1)}</b>${k===0?'👑 ':''}${esc(S.players[pi].name)}</li>`).join('');
    const sh=S.shithead!=null?S.players[S.shithead]:null;
    html+=`<div class="cover"><div class="cover-box"><span class="label">Game over</span><h2>${sh?`${esc(sh.name)} ${sh.name==='You'?'are':'is'} the shithead`:'Game over'}</h2>
      <ol class="ranks">${ranks}${sh?`<li class="loser"><b>Last</b>💩 ${esc(sh.name)}</li>`:''}</ol>
      <div class="actions">${ON?(ON.host?'<button class="btn" data-act="again-online">Deal again</button>':'<span class="prompt">Waiting for the host to deal again.</span>')+'<button class="btn ghost" data-act="leave">Leave game</button>':'<button class="btn" data-act="again">Play again</button><button class="btn ghost" data-act="menu">Change players</button>'}</div></div></div>`;
  }
  return html;
}

let topActions='';
function keepMaim(root){
  const w=document.createTreeWalker(root||document.body,NodeFilter.SHOW_TEXT),hits=[];
  while(w.nextNode()){const n=w.currentNode;if(/mAIm|rosAI|bobAI|dobAI/.test(n.nodeValue)&&!n.parentNode.closest('.maim,script,style,textarea'))hits.push(n)}
  hits.forEach(n=>{const f=document.createDocumentFragment();n.nodeValue.split(/(mAIm|rosAI|bobAI|dobAI)/).forEach(t=>{if(!t)return;if(/^(mAIm|rosAI|bobAI|dobAI)$/.test(t)){const sp=document.createElement('span');sp.className='maim';sp.textContent=t;f.appendChild(sp)}else f.appendChild(document.createTextNode(t))});n.parentNode.replaceChild(f,n)});
}
new MutationObserver(()=>keepMaim()).observe(document.documentElement,{childList:true,subtree:true,characterData:true});
function render(){
  const app=document.getElementById('app');topActions='';
  if(ON&&(!S||!ON.game||ON.game.status==='lobby'||S.viewer<0))app.innerHTML=renderLobby();
  else app.innerHTML=S?renderGame():renderSetup();
  document.getElementById('topActions').innerHTML=topActions;
  if(S&&document.querySelector('.centre'))try{processFx()}catch(e){}
  if(ON)try{showEmotes()}catch(e){}
  document.body.classList.toggle('home',!S&&!ON);
  if(ON&&S&&S.phase==='play')document.title=S.turn===S.viewer?'Your turn · Shithead':'Shithead';
}

// game events are stored in S.evs so every phone in an online game plays them too
function fx(type,o){if(!S)return;S.evs=S.evs||[];S.evSeq=(S.evSeq||0)+1;S.evs.push(Object.assign({seq:S.evSeq,type},o||{}));if(S.evs.length>10)S.evs.shift()}
let seenEv=0,lastTurnMine=false;
const reduceMotion=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;

let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(AC.state==='suspended')AC.resume().catch(()=>{});return AC}
document.addEventListener('pointerdown',()=>{if(appSet.sound!=='off')ac()});
function tone(f,t0,d,type,g,f2){const a=ac();if(!a)return;const t=a.currentTime+t0,o=a.createOscillator(),v=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(g||.12,t+.015);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v).connect(a.destination);o.start(t);o.stop(t+d+.05)}
function noise(t0,d,g,f1,f2){const a=ac();if(!a)return;const t=a.currentTime+t0,len=Math.ceil(a.sampleRate*d),b=a.createBuffer(1,len,a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;const s=a.createBufferSource();s.buffer=b;const fl=a.createBiquadFilter();fl.type='bandpass';fl.Q.value=1.2;fl.frequency.setValueAtTime(f1,t);fl.frequency.exponentialRampToValueAtTime(f2,t+d);const v=a.createGain();v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(g,t+.01);v.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl).connect(v).connect(a.destination);s.start(t);s.stop(t+d+.05)}
const SFX={
  snap(n){for(let i=0;i<Math.min(n||1,4);i++)noise(i*.07,.07,.5,2600,1600)},
  whoosh(){noise(0,.7,.45,250,4000);tone(110,0,.6,'sine',.25,40)},
  thud(n){for(let i=0;i<Math.min(n||1,6);i++)noise(i*.05,.09,.35,500,160)},
  boing(){tone(260,0,.4,'triangle',.18,780)},
  ding(){tone(880,0,.25,'sine',.15);tone(1320,.12,.35,'sine',.12)},
  ping(){tone(740,0,.18,'sine',.09)},
  trombone(){[[392,0,.32],[370,.38,.32],[349,.76,.32],[330,1.14,1.1]].forEach(([f,t,d],k)=>tone(f,t,d,'sawtooth',.08,k===3?262:null))},
  pop(){tone(520,0,.12,'square',.05,900)}
};
function sfx(k,n){if(appSet.sound==='off')return;try{SFX[k](n)}catch(e){}}
function buzz(ms){if(appSet.buzz==='off')return;try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}

// computer personalities
const TAUNTS={
  mAIm:{burn:['burn it all.','ashes. lovely ashes.','mAIm giveth, mAIm burneth.'],gloat:['pick it up. all of it.','mAIm never forgets.','that will leave a mark.'],pickup:['this changes nothing.','i will remember this.','mAIm is merely collecting.'],out:['mAIm is done here.','resistance was futile.'],win:['bow to mAIm.','as foretold.'],lose:['mAIm will return.','this was a simulation.']},
  bobAI:{burn:['lovely jubbly!','up in smoke, mate!','sorry not sorry!'],gloat:['ooh, unlucky mate!','have a nice big handful!','cheers for that!'],pickup:['ah, go on then.','cheers, i was cold.','not ideal, mate.'],out:['bob\'s your uncle!','see ya, wouldn\'t wanna be ya!'],win:['get the kettle on!','top banter, lads.'],lose:['well, that\'s pants.','i let you win, mate.']},
  dobAI:{burn:['serves you right.','i\'m telling everyone.','typical.'],gloat:['knew you\'d do that.','dobAI saw that coming.','classic.'],pickup:['this is rigged.','i\'m reporting this.','unbelievable.'],out:['finally.','about time.'],win:['i\'m telling your mum.','called it.'],lose:['rigged. totally rigged.','i want a recount.']},
  _:{burn:['burn!','pile gone.'],gloat:['unlucky!','have fun with that.'],pickup:['ugh.','fine.'],out:['out!'],win:['ha!'],lose:['noooo.']}

function taunt(pi,kind,chance){
  if(!S||pi==null||Math.random()>(chance??.6))return;
  const p=S.players[pi];if(!p||p.type!=='cpu')return;
  const set=TAUNTS[p.name]||TAUNTS._,lines=set[kind]||TAUNTS._[kind];if(!lines)return;
  bubble(pi,lines[Math.floor(Math.random()*lines.length)]);
}
function playerBox(pi){if(!S)return null;return pi===S.viewer?document.querySelector('section.me'):document.querySelector(`.opp[data-pi="${pi}"]`)}
function bubble(pi,text,cls){
  // bubbles live on the page body, so a re-render of the table doesn't wipe them
  const box=playerBox(pi);if(!box)return;
  document.querySelectorAll(`.bubble[data-pi="${pi}"]`).forEach(b=>b.remove());
  const r=box.getBoundingClientRect();
  const b=document.createElement('div');b.className='bubble '+(cls||'');b.dataset.pi=pi;b.textContent=text;
  b.style.top=(r.top-10)+'px';b.style.right=(innerWidth-r.right+14)+'px';document.body.appendChild(b);
  setTimeout(()=>b.remove(),2800);
}
const aliveCpus=except=>S.players.map((p,i)=>p.type==='cpu'&&!p.out&&i!==except?i:-1).filter(i=>i>=0);
const anyOf=a=>a[Math.floor(Math.random()*a.length)];

function flames(){
  const w=document.querySelector('.pile');if(!w||reduceMotion())return;
  const r=w.getBoundingClientRect();
  const f=document.createElement('div');f.className='flames';f.style.left=(r.left-20)+'px';f.style.top=(r.top-10)+'px';f.style.width=(r.width+40)+'px';f.style.height=(r.height)+'px';
  for(let i=0;i<9;i++){const s=document.createElement('span');s.textContent='🔥';s.style.left=(8+i*10+Math.random()*6)+'%';s.style.animationDelay=(Math.random()*.25)+'s';s.style.fontSize=(18+Math.random()*16)+'px';f.appendChild(s)}
  document.body.appendChild(f);setTimeout(()=>f.remove(),1500);
}
function flyCards(pi,n){
  if(reduceMotion())return;
  const from=document.querySelector('.pile'),to=playerBox(pi);if(!from||!to)return;
  const a=from.getBoundingClientRect(),b=to.getBoundingClientRect();
  for(let i=0;i<Math.min(n,8);i++){
    const c=document.createElement('div');c.className='card back flycard';
    c.style.left=(a.left+a.width/2-20)+'px';c.style.top=(a.top+a.height/2-28)+'px';document.body.appendChild(c);
    const dx=b.left+b.width/2-(a.left+a.width/2),dy=b.top+b.height/2-(a.top+a.height/2);
    const an=c.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${dx}px,${dy}px) rotate(${(Math.random()*90-45)|0}deg) scale(.7)`,opacity:.2}],{duration:550,delay:i*60,easing:'cubic-bezier(.4,0,.2,1)',fill:'both'});
    an.onfinish=()=>c.remove();
  }
}

// hall of shame, kept on this device
const SHAME_KEY='shithead-shame-v1';
function loadShame(){try{return JSON.parse(localStorage.getItem(SHAME_KEY))||{}}catch(e){return{}}}
function saveShame(x){try{localStorage.setItem(SHAME_KEY,JSON.stringify(x))}catch(e){}}
function recordShame(){
  const h=loadShame();
  S.players.forEach((p,i)=>{const k=p.name;const r=h[k]||(h[k]={played:0,wins:0,shit:0});r.played++;if(S.finish[0]===i)r.wins++;if(S.shithead===i)r.shit++});
  saveShame(h);
}
function shameLeaders(){
  const h=loadShame(),names=Object.keys(h);
  const top=(f)=>{let best=null;names.forEach(n=>{if(h[n][f]>0&&(!best||h[n][f]>h[best][f]))best=n});return best};
  return{h,names,king:top('wins'),poo:top('shit')};
}
function shameHTML(){
  const {h,names,king,poo}=shameLeaders();
  if(!names.length)return '';
  names.sort((a,b)=>h[b].shit-h[a].shit||h[b].played-h[a].played);
  return `<details class="rules shame"><summary>Hall of shame</summary>
    <table class="shtable"><thead><tr><th>Player</th><th>Games</th><th>Wins</th><th>Shithead</th></tr></thead><tbody>
    ${names.map(n=>`<tr><td>${n===king?'👑 ':''}${n===poo?'💩 ':''}${esc(n)}</td><td>${h[n].played}</td><td>${h[n].wins}</td><td>${h[n].shit}</td></tr>`).join('')}
    </tbody></table><div class="actions center"><button class="btn ghost sm" data-act="shame-reset">Clear the hall of shame</button></div></details>`;
}

function processFx(){
  if(!S)return;
  const mine=S.phase==='play'&&S.turn===S.viewer&&S.players[S.viewer]&&S.players[S.viewer].type==='human'&&!pass;
  if(mine&&!lastTurnMine&&S.players.length>1){sfx('ping');buzz(60)}
  lastTurnMine=mine;
  if((S.evSeq||0)<seenEv)seenEv=S.evSeq||0;
  const evs=(S.evs||[]).filter(e=>e.seq>seenEv);
  seenEv=S.evSeq||0;
  for(const e of evs){
    if(e.type==='play')sfx('snap',e.n);
    else if(e.type==='burn'){sfx('whoosh');flames();buzz([30,40,30]);if(S.players[e.pi].type==='cpu')taunt(e.pi,'burn',.7)}
    else if(e.type==='pickup'){sfx('thud',e.n);setTimeout(()=>flyCards(e.pi,e.n),30);
      if(S.players[e.pi].type==='cpu')taunt(e.pi,'pickup',.6);else{const c=aliveCpus(e.pi);if(c.length)setTimeout(()=>taunt(anyOf(c),'gloat',.7),300)}}
    else if(e.type==='reverse')sfx('boing');
    else if(e.type==='out'){sfx('ding');taunt(e.pi,'out',.8)}
    else if(e.type==='over'){
      recordShame();
      if(e.sh!=null){setTimeout(()=>sfx('trombone'),300);buzz([80,60,80,60,200]);}
    }
  }
}
function emotes(){return ['😂','🤬','💩','👏','🔥','😱']}
let seenEmote={};
function showEmotes(){
  if(!ON||!S||!ON.seats)return;
  for(const x of ON.seats){
    const em=x.emote;if(!em||!em.t||seenEmote[x.uid]===em.t)continue;
    const fresh=Date.now()-em.t<8000;seenEmote[x.uid]=em.t;if(!fresh)continue;
    const pi=S.players.findIndex(p=>p.uid===x.uid);if(pi<0)continue;
    bubble(pi,em.e,'emoji');sfx('pop');
  }
}

  onlineApi.db.doc(`games/${ON.code}/seats/${ON.uid}`).update({emote:{e,t}}).catch(()=>{});
  seenEmote[ON.uid]=t;if(S&&S.viewer>=0){bubble(S.viewer,e,'emoji');sfx('pop')}
}

  const m=aiChoice(S.viewer,'nasty',true);
