name: Build Android APK
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: shithead-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk shithead.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest shithead.apk --title "Shithead for Android" --notes "Download shithead.apk on your phone and open it to install. Built from ${GITHUB_SHA::7}."
